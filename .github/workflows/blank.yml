name: Tailscale SSH Debug Session

on:
  workflow_dispatch: # 建议通过手动触发开启调试

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    # 关键：设置最大运行时间（如 30 分钟），防止忘记关闭导致免费额度耗尽
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale with SSH enabled
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          # 核心参数：开启 Tailscale 内置 SSH 服务并指定主机名
          args: --ssh --hostname=github-runner-${{ github.run_id }}

      - name: Print connection info & keep runner alive
        run: |
          echo "=========================================="
          echo "Tailscale SSH 已就绪！请在本地终端运行："
          echo "ssh runner@$(tailscale ip -4)"
          echo "或使用主机名："
          echo "ssh runner@github-runner-${{ github.run_id }}"
          echo "=========================================="
          echo "调试完成后，请删除 /tmp/keepalive 文件或直接在 GitHub 页面 Cancel 任务："
          echo "touch /tmp/stop_ssh"
          
          # 保持运行直到手动创建 /tmp/stop_ssh 文件或达到 timeout-minutes 超时
          while [ ! -f /tmp/stop_ssh ]; do
            sleep 5
          done
